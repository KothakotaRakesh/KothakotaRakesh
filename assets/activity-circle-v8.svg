<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">GitHub annual activity circle and verified key figures</title>
<desc id="desc">6 active months of 12 between December 2025 and November 2026. At data collection there were 143 authored commits, 9 public repositories with authored commits, and 13 active dates. Figures reflect public GitHub repository commits, not official GitHub contributions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101A21"/><stop offset="1" stop-color="#18252D"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9FB7B" stop-opacity=".15"/><stop offset=".6" stop-color="#D9FB7B"/><stop offset="1" stop-color="#8AB9C0" stop-opacity=".2"/></linearGradient></defs>
<style>
.pulse{animation:pulse 5s ease-in-out infinite}
.orbit{transform-origin:207px 168px;animation:spin 36s linear infinite}
.stat{animation:glow 7s ease-in-out infinite}
.sweep{stroke-dasharray:36 44;animation:travel 12s linear infinite}
@keyframes pulse{50%{stroke-opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{opacity:.8}}
@keyframes travel{to{stroke-dashoffset:-600}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="290" rx="15" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="288" rx="14" stroke="#5B7780" stroke-opacity=".63" stroke-width="2" fill="none"/>
<path d="M24 53H1176" stroke="#A4B9B6" stroke-opacity=".19"/>
<path d="M24 53H1176" stroke="url(#accent)" stroke-width="2.4" class="sweep"/>
<text x="25" y="35" fill="#F3F5ED" font-size="20" font-family="Arial,sans-serif" letter-spacing="1.7" font-weight="800">ONE YEAR IN MOTION</text>
<text x="1175" y="35" text-anchor="end" fill="#A9BFC2" font-size="13" font-family="Arial,sans-serif" letter-spacing="1.35">NOV 2025 — NOV 2026</text>
<circle cx="207" cy="168" r="119" fill="none" stroke="#6B878D" stroke-opacity=".28"/>
<g class="orbit"><path d="M207.00 49.00 A119 119 0 0 1 317.33 123.42" fill="none" stroke="#D9FA80" stroke-width="2.5" stroke-linecap="round"/><circle cx="207" cy="49" r="4" fill="#D9FA80"/></g>
<path d="M215.02 76.35 A92 92 0 0 1 245.88 84.62" fill="none" stroke="#34464D" stroke-width="16" stroke-linecap="round" class="" style="animation-delay:0.00s"/>

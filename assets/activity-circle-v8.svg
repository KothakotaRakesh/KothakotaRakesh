<path d="M290.38 129.12 A92 92 0 0 1 298.65 159.98" fill="none" stroke="#9BC6C0" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:0.54s"/>
<path d="M298.65 176.02 A92 92 0 0 1 290.38 206.88" fill="none" stroke="#9BC6C0" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:0.81s"/>
<path d="M282.36 220.77 A92 92 0 0 1 259.77 243.36" fill="none" stroke="#34464D" stroke-width="16" stroke-linecap="round" class="" style="animation-delay:1.08s"/>

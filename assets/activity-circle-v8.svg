<path d="M198.98 259.65 A92 92 0 0 1 168.12 251.38" fill="none" stroke="#34464D" stroke-width="16" stroke-linecap="round" class="" style="animation-delay:1.62s"/>
<path d="M154.23 243.36 A92 92 0 0 1 131.64 220.77" fill="none" stroke="#34464D" stroke-width="16" stroke-linecap="round" class="" style="animation-delay:1.89s"/>
<path d="M123.62 206.88 A92 92 0 0 1 115.35 176.02" fill="none" stroke="#9BC6C0" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:2.16s"/>
<path d="M115.35 159.98 A92 92 0 0 1 123.62 129.12" fill="none" stroke="#9BC6C0" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:2.43s"/>
<path d="M131.64 115.23 A92 92 0 0 1 154.23 92.64" fill="none" stroke="#9BC6C0" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:2.70s"/>
<path d="M168.12 84.62 A92 92 0 0 1 198.98 76.35" fill="none" stroke="#DAFA82" stroke-width="16" stroke-linecap="round" class="pulse" style="animation-delay:2.97s"/>
<circle cx="207" cy="168" r="71" fill="#16232C" stroke="#4E6B72"/>
<text x="207" y="170" fill="#F5F5ED" text-anchor="middle" font-size="52" font-family="Arial,sans-serif" font-weight="800">6<tspan font-size="28" fill="#AABFC4">/12</tspan></text>
<text x="207" y="194" fill="#9FC0C1" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" letter-spacing="1.4" font-weight="800">MONTHS</text>
<g class="stat" style="animation-delay:0s"><rect x="380" y="80" width="248" height="171" rx="13" fill="#1C2931" stroke="#58747B" stroke-opacity=".6"/><path d="M399 112H609" stroke="#DAFA82" stroke-width="2" stroke-opacity=".72"/><text x="400" y="173" fill="#DAFA82" font-size="58" font-family="Arial,sans-serif" font-weight="800">143</text><text x="400" y="201" fill="#F0F3EB" font-size="14" font-family="Arial,sans-serif" letter-spacing="1.1" font-weight="800">AUTHORED COMMITS</text><text x="400" y="228" fill="#91A8B0" font-size="13" font-family="Arial,sans-serif">Across public repositories</text></g>
<g class="stat" style="animation-delay:-1.2s"><rect x="643" y="80" width="248" height="171" rx="13" fill="#1C2931" stroke="#58747B" stroke-opacity=".6"/><path d="M662 112H872" stroke="#8DC2C4" stroke-width="2" stroke-opacity=".72"/><text x="663" y="173" fill="#8DC2C4" font-size="58" font-family="Arial,sans-serif" font-weight="800">09</text><text x="663" y="201" fill="#F0F3EB" font-size="14" font-family="Arial,sans-serif" letter-spacing="1.1" font-weight="800">ACTIVE REPOSITORIES</text><text x="663" y="228" fill="#91A8B0" font-size="13" font-family="Arial,sans-serif">With authored history</text></g>
<g class="stat" style="animation-delay:-2.4s"><rect x="906" y="80" width="248" height="171" rx="13" fill="#1C2931" stroke="#58747B" stroke-opacity=".6"/><path d="M925 112H1135" stroke="#F0B79A" stroke-width="2" stroke-opacity=".72"/><text x="926" y="173" fill="#F0B79A" font-size="58" font-family="Arial,sans-serif" font-weight="800">13</text><text x="926" y="201" fill="#F0F3EB" font-size="14" font-family="Arial,sans-serif" letter-spacing="1.1" font-weight="800">ACTIVE DATES</text><text x="926" y="228" fill="#91A8B0" font-size="13" font-family="Arial,sans-serif">In the selected year</text></g>
<text x="207" y="281" fill="#93ABB0" text-anchor="middle" font-size="11" font-family="Arial,sans-serif">FEB · MAR · AUG · SEP · OCT · NOV</text>
</svg>
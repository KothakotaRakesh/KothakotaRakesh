<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="318" viewBox="0 0 1000 318" role="img" aria-labelledby="title description">
<title id="title">Kothakota Rakesh — software developer</title>
<desc id="description">Modern editorial profile banner in graphite, warm ivory, burnt orange and muted teal, with animated orbital geometry, a light-sweep and a fine moving timeline.</desc>
<defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11181E"/><stop offset=".62" stop-color="#162027"/><stop offset="1" stop-color="#1E292D"/></linearGradient>
<linearGradient id="burnt" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F29A73"/><stop offset="1" stop-color="#D77855"/></linearGradient>
<linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E88A68" stop-opacity="0"/><stop offset=".35" stop-color="#F49B78"/><stop offset=".7" stop-color="#9FC6C2"/><stop offset="1" stop-color="#9FC6C2" stop-opacity="0"/></linearGradient>
<pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#F2F0E8" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="998" height="316" x="1" y="1" rx="17"/></clipPath>
</defs>
<style>
 .ring{transform-origin:809px 150px;animation:rotate 32s linear infinite}
 .ring2{transform-origin:809px 150px;animation:rotate 43s linear infinite reverse}
 .beam{stroke-dasharray:34 48;animation:beam 14s linear infinite}
 .cursor{animation:blink 1.35s steps(1) infinite}
 .spark{animation:dim 3.7s ease-in-out infinite}
 .sweep{animation:sweep 13s linear infinite}
 @keyframes rotate{to{transform:rotate(360deg)}}
 @keyframes beam{to{stroke-dashoffset:-600}}
 @keyframes blink{50%{opacity:0}}
 @keyframes dim{50%{opacity:.35}}
 @keyframes sweep{0%,10%{transform:translateX(-950px);opacity:0}18%{opacity:.4}70%,100%{transform:translateX(1270px);opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="318" rx="18" fill="url(#back)"/>
<g clip-path="url(#clip)">
<rect width="1000" height="318" fill="url(#dotgrid)"/>
<path d="M22 40H977M22 274H977" stroke="#8AA3A3" stroke-opacity=".17"/>
<path d="M21 274H978" stroke="url(#track)" stroke-width="3" class="beam"/>
<path d="M641 0L930 318M709 0L998 318" stroke="#C3D0C8" stroke-opacity=".06" fill="none"/>
<path d="M648 0V318M654 39H998M654 274H998" stroke="#789397" stroke-opacity=".17" fill="none"/>
<rect x="-120" y="0" width="62" height="318" fill="#F5AE88" opacity=".1" transform="rotate(9 0 0)" class="sweep"/>
<circle cx="809" cy="150" r="128" fill="#1B272C" stroke="#B0C4C1" stroke-opacity=".19"/>
<circle cx="809" cy="150" r="108" fill="none" stroke="#B1C9C6" stroke-opacity=".25" stroke-dasharray="3 12"/>
<circle cx="809" cy="150" r="86" fill="#182329" stroke="#8FAAA9" stroke-opacity=".35"/>
<circle cx="809" cy="150" r="65" fill="#222F32" stroke="#8FA4A0" stroke-opacity=".26"/>
<g class="ring">
<path d="M809 22A128 128 0 0 1 937 150" stroke="#EF916D" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="809" cy="22" r="5" fill="#F7A37F" class="spark"/>
</g>
<g class="ring2">
<path d="M809 258A108 108 0 0 1 701 150" stroke="#8AC1B9" stroke-width="2.7" fill="none" stroke-linecap="round"/>
<circle cx="809" cy="258" r="4" fill="#91CAC0"/>
</g>
<path d="M808 101V199M760 150H857" stroke="#AFC2B9" stroke-opacity=".15" stroke-width="1.5"/>
<circle cx="970" cy="81" r="2.8" fill="#ECA07E" class="spark"/>
<circle cx="671" cy="238" r="2.8" fill="#9FCECB" class="spark"/>
</g>
<rect x="1" y="1" width="998" height="316" rx="17" fill="none" stroke="#677F82" stroke-opacity=".65" stroke-width="1.5"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="30" y="29" fill="#DBA88E" font-size="13" font-weight="700" letter-spacing="2.6">K / R</text>
<text x="974" y="29" text-anchor="end" fill="#A1B3B4" font-size="11.5" letter-spacing="2.1">PERSONAL DEVELOPER PROFILE</text>
<rect x="29" y="63" width="130" height="26" rx="13" fill="#2D3B3B" stroke="#C88E73" stroke-opacity=".55"/>
<circle cx="46" cy="76" r="4.1" fill="#EAA27E" class="spark"/>
<text x="58" y="81" fill="#F5D7C8" font-size="11.5" letter-spacing="1.2" font-weight="700">HELLO, I'M</text>
<text x="27" y="155" font-size="61" font-weight="800" letter-spacing="-1.9" fill="#F4F1E9">Kothakota</text>
<text x="23" y="240" font-family="Georgia,serif" font-style="italic" font-size="100" letter-spacing="-5" font-weight="700" fill="url(#burnt)">Rakesh<tspan class="cursor" font-family="Arial,Helvetica,sans-serif" font-style="normal" font-weight="400" fill="#F1EEE7">_</tspan></text>
<text x="30" y="301" fill="#F2F0E8" font-size="16.5" letter-spacing="1" font-weight="700">AI/ML STUDENT</text>
<circle cx="179" cy="296" r="3.5" fill="#F19A76"/>
<text x="195" y="301" fill="#B9CBCB" font-size="16" font-weight="600">FULL-STACK DEVELOPER</text>
<text x="809" y="168" text-anchor="middle" font-family="Georgia,serif" font-size="61" font-style="italic" font-weight="700" fill="#F4EFE5">KR.</text>
<text x="809" y="242" text-anchor="middle" fill="#8DB2AF" font-size="11.2" letter-spacing="2">LEARN / BUILD</text>
</g>
</svg>
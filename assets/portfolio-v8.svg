 @keyframes pulse{50%{opacity:.28}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
 <rect x="1" y="1" width="378" height="86" rx="13" fill="#D9FB83" stroke="#CFF16C" stroke-width="2"/>
 <rect x="14" y="14" width="60" height="60" rx="10" fill="#A7D262" stroke="#91B64E" stroke-opacity=".72"/>
 <text x="44" y="54" fill="#182022" font-size="33" font-family="Arial,Helvetica,sans-serif" font-weight="900" text-anchor="middle">↗</text>
 <text x="94" y="40" fill="#182022" font-size="23" font-family="Arial,Helvetica,sans-serif" letter-spacing="1.2" font-weight="900">PORTFOLIO</text>
 <text x="94" y="61" fill="#3E5948" font-size="12.5" font-family="Arial,Helvetica,sans-serif" letter-spacing="1.2" font-weight="700">MY CONTACT PAGE</text>
 <g class="arrow"><path d="M331 28H353V51M353 28L331 52" stroke="#182022" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Kothakota Rakesh — developer profile</title>
<desc id="desc">Editorial midnight ink and citrus developer nameplate, with a subtle animated orbital monogram and moving design grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#10191F"/><stop offset=".58" stop-color="#10171F"/><stop offset="1" stop-color="#19232A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#DDFE83"/><stop offset="1" stop-color="#9CD8AF"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#DDFE83" stop-opacity="0"/><stop offset=".5" stop-color="#DDFE83"/><stop offset="1" stop-color="#8DAAB2" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect x="1" y="1" width="1198" height="398" rx="19"/></clipPath>
  <pattern id="dots" patternUnits="userSpaceOnUse" width="28" height="28">
    <circle cx="3" cy="3" r="1" fill="#E5F0E6" fill-opacity=".075"/>
  </pattern>
</defs>
<style>
  .orbit{transform-origin:974px 194px;animation:spin 27s linear infinite}
  .orbit-reverse{transform-origin:974px 194px;animation:spin 40s linear infinite reverse}
  .axis{stroke-dasharray:7 15;animation:axis 15s linear infinite}
  .signal{stroke-dasharray:38 450;animation:signal 9s linear infinite}
  .cursor{animation:blink 1.3s steps(1,end) infinite}
  .blip{animation:blip 3.5s ease-in-out infinite}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes axis{to{stroke-dashoffset:-220}}
  @keyframes signal{to{stroke-dashoffset:-960}}
  @keyframes blink{50%{opacity:0}}
  @keyframes blip{50%{opacity:.3}}
  @keyframes float{50%{transform:translateY(-5px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="400" rx="20" fill="url(#bg)"/>
<g clip-path="url(#round)">
  <rect width="1200" height="400" fill="url(#dots)"/>
  <path d="M760 0V400M760 0L1170 400M830 0L1200 360" fill="none" stroke="#9BB3B6" stroke-opacity=".1"/>
  <path d="M770 70H1195M770 320H1195" stroke="#A3BEC1" stroke-opacity=".15"/>
  <path d="M770 70H1195" stroke="#B5E6A7" stroke-opacity=".4" stroke-width="2" class="axis"/>
  <path d="M0 363H1200" stroke="#A0B5B5" stroke-opacity=".21"/>
  <path d="M0 363H1200" stroke="url(#line)" stroke-width="3" class="signal"/>
  <g transform="translate(974 194)">
    <circle r="159" fill="#172229" stroke="#7FA0A4" stroke-opacity=".21"/>
    <circle r="137" fill="none" stroke="#D4E6D2" stroke-opacity=".13" stroke-dasharray="1 11"/>
    <circle r="117" fill="none" stroke="#C0D9D1" stroke-opacity=".28"/>
    <circle r="92" fill="none" stroke="#A3BBC1" stroke-opacity=".22"/>
    <circle r="78" fill="#172127" stroke="#5C747B" stroke-opacity=".6"/>
  </g>
  <g class="orbit">
    <path d="M974 35A159 159 0 0 1 1133 194" stroke="#D8FA82" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="974" cy="35" r="5.2" fill="#D9F980"/>
  </g>
  <g class="orbit-reverse">
    <path d="M974 311A117 117 0 0 1 857 194" stroke="#83B8BB" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="974" cy="311" r="4" fill="#9ACDD2"/>
  </g>
  <circle cx="1140" cy="306" r="3.5" fill="#D9F980" class="blip"/>
  <circle cx="792" cy="151" r="2.5" fill="#B8CBD0" class="blip"/>
</g>
<rect x="1" y="1" width="1198" height="398" rx="19" stroke="#65838B" stroke-opacity=".65" stroke-width="2" fill="none"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="43" y="36" width="186" height="31" rx="15" fill="#27392E" stroke="#A9CB73" stroke-opacity=".65"/>
  <circle cx="61" cy="51.5" r="5" fill="#DBFB82" class="blip"/>
  <text x="75" y="57" font-size="12" letter-spacing="1.8" font-weight="800" fill="#DAF8AE">DEVELOPER / INDIA</text>
  <text x="53" y="150" font-size="72" font-weight="800" letter-spacing="-2.1" fill="#F4F4ED">Kothakota</text>
  <text x="47" y="266" font-size="124" font-weight="800" letter-spacing="-4.8" fill="url(#accent)">Rakesh<tspan class="cursor" fill="#F4F4ED" font-weight="400">_</tspan></text>
  <text x="54" y="320" font-size="22" letter-spacing="1.05" font-weight="700" fill="#F2F4ED">AI/ML STUDENT</text>
  <circle cx="253" cy="313" r="4.3" fill="#DDFE83"/>
  <text x="272" y="320" font-size="21" letter-spacing=".8" fill="#B3CBD0" font-weight="600">FULL-STACK DEVELOPER</text>
  <text x="51" y="384" font-size="12" letter-spacing="2.3" fill="#8EA6AB" font-weight="700">PYTHON  /  REACT  /  FASTAPI  /  ALGORITHMS</text>
  <text x="1180" y="33" text-anchor="end" font-size="12" letter-spacing="2.1" fill="#A2B4B7">K / R     2026</text>
</g>
<g class="float">
  <text x="975" y="220" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="94" font-weight="700" fill="#F3F4EA">R</text>
  <path d="M932 236H1018" stroke="#D8F58A" stroke-width="2.2" opacity=".74"/>
</g>
</svg>
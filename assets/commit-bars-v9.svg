<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">GitHub authored commit records — recent active dates</title>
<desc id="desc">Historical commit counts on eight most recent active dates up to November 28 2026: October 30 10, November 10 25, November 18 8, November 22 18, November 25 20, November 26 1, November 27 25 and November 28 22. These represent public repository commits, not GitHub's contributions total.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121D23"/><stop offset="1" stop-color="#19272C"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E9916D" stop-opacity=".08"/><stop offset=".45" stop-color="#F6B28F"/><stop offset="1" stop-color="#8BB6B4" stop-opacity=".3"/></linearGradient>
</defs>
<style>
.bar{animation:grow 1.15s cubic-bezier(.21,.84,.25,1) both;transform-box:fill-box;transform-origin:center bottom}
.guide{stroke-dasharray:30 28;animation:guide 12s linear infinite}
.marker{animation:marker 3s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(.025);opacity:.3}to{transform:scaleY(1);opacity:1}}
@keyframes guide{to{stroke-dashoffset:-610}}
@keyframes marker{50%{opacity:.32}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="360" rx="16" fill="url(#bg)"/>

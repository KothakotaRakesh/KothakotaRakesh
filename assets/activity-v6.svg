<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Real public GitHub activity: circular activity chart and recent commit graph</title>
<desc id="desc">134 authored commits across 9 public repositories, 13 active calendar dates in the last 12 months. Activity occurred in 6 of 12 months. Bars show the eight most recent dates with commits: 10, 25, 8, 18, 20, 1, 25, 13. GitHub public repository data as of 28 November 2026 UTC.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a20"/><stop offset="1" stop-color="#172329"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b282e"/><stop offset="1" stop-color="#172127"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c2a47d" stop-opacity=".2"/><stop offset=".5" stop-color="#ead3ae" stop-opacity=".95"/><stop offset="1" stop-color="#86b7b4" stop-opacity=".35"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#e9b77b" stop-opacity=".12"/><stop offset="1" stop-color="#e9b77b" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c2cec8" opacity=".055"/></pattern>
</defs>
<style>
 .ring-lit{animation:ring 5s ease-in-out infinite}
 .data-bar{animation:grow 1.5s ease-out both;transform-box:fill-box;transform-origin:center bottom}
 .orbit{transform-origin:217px 286px;animation:turn 32s linear infinite}
 .scan{stroke-dasharray:20 16;animation:travel 12s linear infinite}
 .dot{animation:dim 3s ease-in-out infinite}
 @keyframes ring{50%{opacity:.65}}
 @keyframes grow{from{transform:scaleY(.04);opacity:.2}to{transform:scaleY(1);opacity:1}}
 @keyframes turn{to{transform:rotate(360deg)}}
 @keyframes travel{to{stroke-dashoffset:-480}}
 @keyframes dim{50%{opacity:.35}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="500" rx="19" fill="url(#bg)"/>
<rect width="1200" height="500" rx="19" fill="url(#dots)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title">
<title id="title">Technical toolkit: Python, JavaScript, React, FastAPI, SQL and Git</title>
<defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172126"/><stop offset="1" stop-color="#1b272d"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c3a579" stop-opacity="0"/><stop offset=".5" stop-color="#dfc499"/><stop offset="1" stop-color="#91b4ae" stop-opacity="0"/></linearGradient></defs>
<style>
.chip{animation:glow 5s ease-in-out infinite}
.trail{stroke-dasharray:35 16;animation:walk 20s linear infinite}
@keyframes glow{50%{opacity:.7}}
@keyframes walk{to{stroke-dashoffset:-500}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="132" rx="14" fill="url(#base)"/>
<rect x="1" y="1" width="1198" height="130" rx="13" fill="none" stroke="#71827d" stroke-opacity=".43"/>

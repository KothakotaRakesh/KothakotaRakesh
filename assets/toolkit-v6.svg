<g class="chip" style="animation-delay:-0.96s"><rect x="427" y="41" width="153" height="50" rx="10" fill="#1e2d31" stroke="#9fc6ca" stroke-opacity=".56"/><circle cx="446" cy="66" r="5" fill="#9fc6ca"/><text x="461" y="72" fill="#e3e8e2" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing=".65">REACT</text></g>
<g class="chip" style="animation-delay:-1.44s"><rect x="593" y="41" width="161" height="50" rx="10" fill="#1e2d31" stroke="#b0cabb" stroke-opacity=".56"/><circle cx="612" cy="66" r="5" fill="#b0cabb"/><text x="627" y="72" fill="#e3e8e2" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing=".65">FASTAPI</text></g>

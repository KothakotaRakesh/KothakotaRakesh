<g class="chip" style="animation-delay:-2.40s"><rect x="892" y="41" width="112" height="50" rx="10" fill="#1e2d31" stroke="#dbb990" stroke-opacity=".56"/><circle cx="911" cy="66" r="5" fill="#dbb990"/><text x="926" y="72" fill="#e3e8e2" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing=".65">GIT</text></g>
<text x="1135" y="72" fill="#bfaa8d" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.3" text-anchor="end">AND GROWING</text>

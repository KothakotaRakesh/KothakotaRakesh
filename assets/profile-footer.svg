<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="105" viewBox="0 0 1000 105" role="img" aria-label="Stay curious, keep building, keep improving">
<defs><linearGradient id="track" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#60e6cd" stop-opacity="0"/><stop offset=".32" stop-color="#60e6cd"/><stop offset=".65" stop-color="#a59bff"/><stop offset="1" stop-color="#9f8cff" stop-opacity="0"/></linearGradient></defs>
<style>
 .travel{animation:travel 9s linear infinite}.heart{animation:glow 3s ease-in-out infinite}
 @keyframes travel{to{stroke-dashoffset:-700}}
 @keyframes glow{50%{opacity:.48}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="105" rx="14" fill="#0e1629"/>
<rect x="1" y="1" width="998" height="103" rx="13" fill="none" stroke="#405779" stroke-opacity=".6"/>
<path d="M40 24H960" stroke="url(#track)" stroke-width="2" stroke-dasharray="19 12" class="travel"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="500" y="61" font-size="20" font-weight="800" fill="#eaf3ff" letter-spacing="1.2">STAY CURIOUS. KEEP BUILDING.</text>
 <text x="500" y="86" font-size="11" font-weight="700" fill="#85d9d7" letter-spacing="3.2">ONE COMMIT AT A TIME</text>
</g>
<circle cx="30" cy="78" r="4" fill="#61e8ae" class="heart"/><circle cx="970" cy="78" r="4" fill="#a18fff" class="heart"/>
</svg>
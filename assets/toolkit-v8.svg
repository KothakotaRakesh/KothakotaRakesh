<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="423" viewBox="0 0 1200 423" role="img" aria-labelledby="title desc">
<title id="title">Kothakota Rakesh technical toolkit</title>
<desc id="desc">Clean animated 2-by-2 skill panel: interface and web development, API and backend engineering, machine learning and algorithms, and developer workflow.</desc>
<style>
.tile{animation:lift 8s ease-in-out infinite}
.run{stroke-dasharray:65 45;animation:trace 11s linear infinite}
.twinkle{animation:glow 3s ease-in-out infinite}
@keyframes lift{50%{transform:translateY(-3px)}}
@keyframes trace{to{stroke-dashoffset:-500}}
@keyframes glow{50%{opacity:.26}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

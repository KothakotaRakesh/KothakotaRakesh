<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
<title id="title">Kothakota Rakesh — Developer Profile</title>
<desc id="desc">Original animated dark executive-tech banner. AI/ML student and full-stack developer. Features a glowing terminal window, orbital rings and luminous linework.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset=".52" stop-color="#101c30"/><stop offset="1" stop-color="#0e1229"/></linearGradient>
  <radialGradient id="sky"><stop stop-color="#2bafc5" stop-opacity=".24"/><stop offset=".55" stop-color="#3c6eca" stop-opacity=".11"/><stop offset="1" stop-color="#3c6eca" stop-opacity="0"/></radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#69eed6"/><stop offset=".43" stop-color="#70d6f5"/><stop offset="1" stop-color="#b9a3ff"/></linearGradient>
  <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#69eed6" stop-opacity="0"/><stop offset=".35" stop-color="#69eed6" stop-opacity=".8"/><stop offset=".7" stop-color="#b9a3ff" stop-opacity=".8"/><stop offset="1" stop-color="#b9a3ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192b40"/><stop offset="1" stop-color="#111729"/></linearGradient>
  <linearGradient id="cardline" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92c8ed" stop-opacity=".6"/><stop offset="1" stop-color="#847dec" stop-opacity=".25"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#d4e8ff" stroke-opacity=".065" fill="none"/></pattern>
  <clipPath id="clip"><rect width="1198" height="453" x="1" y="1" rx="23"/></clipPath>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<style>
  .rotate{transform-origin:971px 224px;animation:rotate 31s linear infinite}
  .counter{transform-origin:971px 224px;animation:rotate 22s linear reverse infinite}
  .float{animation:float 7s ease-in-out infinite}
  .blink{animation:blink 1.15s steps(1) infinite}
  .bar{animation:bar 4.5s ease-in-out infinite alternate}
  .bar-b{animation-delay:-1.8s}.bar-c{animation-delay:-3.1s}
  .shine{animation:shine 9s ease-in-out infinite}
  .pulse{animation:pulse 3.3s ease-in-out infinite}
  .drift{animation:drift 19s linear infinite}
  @keyframes rotate{to{transform:rotate(360deg)}}
  @keyframes float{50%{transform:translateY(-8px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes bar{50%{opacity:.24;transform:scaleX(.8)}}
  @keyframes shine{0%{transform:translateX(-680px);opacity:0}15%{opacity:.46}45%{opacity:.12}60%,100%{transform:translateX(1700px);opacity:0}}
  @keyframes pulse{50%{opacity:.38}}
  @keyframes drift{to{stroke-dashoffset:-480}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="455" rx="23" fill="url(#back)"/>
<g clip-path="url(#clip)">
  <rect width="1200" height="455" fill="url(#grid)"/>
  <circle cx="962" cy="225" r="320" fill="url(#sky)" class="pulse"/>
  <path d="M0 0H1200M0 453H1200" stroke="url(#seam)" stroke-width="3"/>
  <path d="M-20 375C270 225 505 535 785 335S1125 145 1260 220" stroke="#75d8ec" stroke-opacity=".13" stroke-width="2" fill="none"/>
  <path d="M-20 402C270 252 505 560 785 362S1125 172 1260 247" stroke="#ad8ef8" stroke-opacity=".1" stroke-width="2" fill="none"/>
  <rect x="0" y="0" width="90" height="453" fill="#ffffff" opacity=".03" class="shine"/>
  <g fill="none" stroke="#80b2dc">
    <circle cx="971" cy="224" r="176" stroke-opacity=".11"/>
    <circle cx="971" cy="224" r="136" stroke-opacity=".23" stroke-dasharray="5 13"/>
    <circle cx="971" cy="224" r="99" stroke-opacity=".2"/>
  </g>
  <g class="rotate">
    <path d="M971 48A176 176 0 0 1 1147 224" fill="none" stroke="#79f0d9" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
    <circle cx="971" cy="48" r="5" fill="#72f0d9"/>
  </g>
  <g class="counter">
    <path d="M971 352A128 128 0 0 1 843 224" fill="none" stroke="#a5a0ff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="971" cy="352" r="4" fill="#b8a1ff"/>
  </g>
  <g opacity=".4" stroke-dasharray="3 11" stroke="#99d8f2" fill="none">
    <path d="M670 75L755 75L810 130" class="drift"/><path d="M635 414L775 414L839 350" class="drift"/>
  </g>
  <g fill="#90dced"><circle cx="715" cy="56" r="2"/><circle cx="1152" cy="348" r="2.5"/><circle cx="628" cy="360" r="1.8"/></g>
</g>
<rect width="1198" height="453" x="1" y="1" rx="23" fill="none" stroke="#88bddc" stroke-opacity=".35" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="52" y="39" width="245" height="36" rx="18" fill="#132c39" stroke="#4aa4a9" stroke-opacity=".6"/>
  <circle cx="72" cy="57" r="5" fill="#71f0be" class="pulse"/>
  <text x="86" y="62" fill="#abf4e6" font-size="13" font-weight="800" letter-spacing="1.9">DEVELOPER IDENTITY</text>
  <text x="47" y="152" fill="#f1f7ff" font-size="72" font-weight="900" letter-spacing="-2">KOTHAKOTA</text>
  <text x="46" y="257" fill="url(#brand)" font-size="121" font-weight="900" letter-spacing="-4">RAKESH</text>
  <rect x="54" y="277" width="575" height="3" rx="1.5" fill="url(#seam)"/>
  <text x="54" y="320" fill="#d2e0f1" font-size="24" font-weight="700" letter-spacing="1.25">AI/ML STUDENT  <tspan fill="#70eadb">·</tspan>  FULL-STACK DEVELOPER</text>
  <text x="54" y="365" fill="#a1b3ca" font-size="16" letter-spacing="2.2" font-weight="600">PYTHON  /  REACT  /  FASTAPI  /  INTELLIGENT SYSTEMS</text>
  <rect x="54" y="392" width="208" height="31" rx="15.5" fill="#1a3540" stroke="#66dcd4" stroke-opacity=".45"/>
  <text x="72" y="413" fill="#88f0e0" font-weight="800" font-size="12" letter-spacing="1.1">LEARN   •   BUILD   •   GROW</text>
</g>
<g class="float">
  <rect x="749" y="113" width="390" height="260" rx="19" fill="#040914" opacity=".5" filter="url(#shadow)"/>
  <rect x="743" y="102" width="390" height="260" rx="17" fill="url(#terminal)" stroke="url(#cardline)" stroke-width="1.7"/>
  <path d="M743 148H1133" stroke="#9bb6d4" stroke-opacity=".32"/>
  <circle cx="766" cy="126" r="6" fill="#fc898d"/><circle cx="787" cy="126" r="6" fill="#f5c976"/><circle cx="808" cy="126" r="6" fill="#7ce4ac"/>
  <text x="855" y="132" fill="#93a9c8" font-family="monospace" font-size="14">rakesh.profile.ts</text>
  <g font-family="monospace" font-size="18">
    <text x="766" y="195"><tspan fill="#c5b7ff">const</tspan><tspan fill="#dae9ff"> engineer = {</tspan></text>
    <text x="788" y="227"><tspan fill="#a5bfe1">name:</tspan><tspan fill="#84ecc6"> "Rakesh"</tspan><tspan fill="#e3efff">,</tspan></text>
    <text x="788" y="259"><tspan fill="#a5bfe1">stack:</tspan><tspan fill="#84ecc6"> ["AI", "Web"]</tspan><tspan fill="#e3efff">,</tspan></text>
    <text x="788" y="291"><tspan fill="#a5bfe1">curiosity:</tspan><tspan fill="#ffca92"> Infinity</tspan><tspan fill="#e3efff">,</tspan></text>
    <text x="788" y="323"><tspan fill="#a5bfe1">building:</tspan><tspan fill="#b6a4ff"> true</tspan><tspan class="blink" fill="#8af1dc"> ▌</tspan></text>
    <text x="766" y="346" fill="#d8e7fa">};</text>
  </g>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="1010" y="386" width="147" height="34" rx="17" fill="#172c39" stroke="#64c7c2" stroke-opacity=".7"/>
  <circle cx="1030" cy="403" r="5" fill="#7aefb2" class="pulse"/>
  <text x="1043" y="408" fill="#a7eee0" font-size="13" font-weight="800" letter-spacing=".9">BUILD MODE</text>
</g>
</svg>
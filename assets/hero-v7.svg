<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Kothakota Rakesh — developer identity</title>
<desc id="desc">Minimal architectural dark profile banner in charcoal, ivory, and ember orange. Animated orbit, signature underline and delicate plotting lines.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#101419"/><stop offset="1" stop-color="#182128"/>
  </linearGradient>
  <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#F17952"/><stop offset="1" stop-color="#F9AD79"/>
  </linearGradient>
  <pattern id="mesh" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#B2C1C2" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="378" rx="14"/></clipPath>
</defs>
<style>
.orbit{transform-origin:971px 177px;animation:rotate 26s linear infinite}
.orbit-reverse{transform-origin:971px 177px;animation:rotate 37s linear infinite reverse}
.pulse{animation:pulse 4s ease-in-out infinite}
.trace{stroke-dasharray:70 250;animation:travel 13s linear infinite}
.cursor{animation:blink 1.2s steps(1) infinite}
.float{animation:float 7s ease-in-out infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes travel{to{stroke-dashoffset:-640}}
@keyframes blink{50%{opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="380" rx="15" fill="url(#base)"/>
<g clip-path="url(#clip)">
 <rect width="1200" height="380" fill="url(#mesh)"/>
 <path d="M0 304H1200" stroke="#B0C0C1" stroke-opacity=".11"/>
 <path d="M0 304H1200" stroke="#F18B64" stroke-width="2" class="trace"/>
 <path d="M730 25H1190M730 335H1190" stroke="#B0C0C1" stroke-opacity=".14"/>
 <path d="M775 0V380" stroke="#B0C0C1" stroke-opacity=".14"/>
 <path d="M802 22L1166 335" stroke="#F18B64" stroke-opacity=".065" stroke-width="2"/>
 <path d="M775 380L1145 25" stroke="#A9B7B7" stroke-opacity=".08"/>
 <g fill="none" stroke="#93ABA9">
  <circle cx="971" cy="177" r="141" stroke-opacity=".14" stroke-dasharray="2 12"/>
  <circle cx="971" cy="177" r="113" stroke-opacity=".28" />
  <circle cx="971" cy="177" r="87" stroke-opacity=".18"/>
 </g>
 <g class="orbit">
  <path d="M971 36A141 141 0 0 1 1112 177" fill="none" stroke="#F18B64" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="971" cy="36" r="5" fill="#FF9F72"/>
 </g>
 <g class="orbit-reverse">
  <path d="M971 290A113 113 0 0 1 858 177" fill="none" stroke="#82B9AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="971" cy="290" r="3.5" fill="#82B9AF"/>
 </g>
 <circle cx="971" cy="177" r="65" fill="#202A2E" stroke="#4F6262" stroke-opacity=".6"/>
 <g class="float">
  <path d="M931 137L1011 217M1011 137L931 217" stroke="#FDAD82" stroke-opacity=".07" stroke-width="6"/>
  <text x="971" y="193" text-anchor="middle" font-family="Georgia,serif" font-size="62" font-style="italic" font-weight="700" fill="#F2F0E9">R.</text>
 </g>
 <circle cx="1180" cy="44" r="2.5" fill="#F39D72" class="pulse"/>
 <circle cx="791" cy="300" r="2.5" fill="#84B7AE" class="pulse"/>
</g>
<rect x="1" y="1" width="1198" height="378" rx="14" fill="none" stroke="#58676B" stroke-opacity=".72" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="48" y="45" fill="#F3AE85" font-size="14.5" letter-spacing="3.1" font-weight="800">K / R</text>
 <text x="1190" y="45" text-anchor="end" fill="#B1C2C0" font-size="13" font-weight="700" letter-spacing="2">DEVELOPER PROFILE   •   2026</text>
 <rect x="48" y="67" width="170" height="3" rx="1.5" fill="url(#ember)"/>
 <text x="46" y="153" fill="#F4F4EE" font-size="74" font-weight="800" letter-spacing="-2.7">Kothakota</text>
 <text x="43" y="257" fill="url(#ember)" font-family="Georgia,serif" font-size="108" font-weight="700" font-style="italic" letter-spacing="-4">Rakesh<tspan class="cursor" font-family="Arial,Helvetica,sans-serif" font-style="normal" font-weight="400">_</tspan></text>
 <text x="49" y="337" fill="#E8EEE9" font-size="21" font-weight="700" letter-spacing="1.7">AI / ML STUDENT</text>
 <circle cx="315" cy="330" r="4" fill="#F18B64"/>
 <text x="335" y="337" fill="#B7C8C7" font-size="20" letter-spacing="1.1">FULL-STACK DEVELOPER</text>
 <text x="1190" y="362" text-anchor="end" fill="#7F9995" font-size="12" letter-spacing="1.3">LEARNING THROUGH BUILDING</text>
</g>
</svg>
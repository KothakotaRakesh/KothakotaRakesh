</defs>
<style>
.orbit{transform-origin:182px 182px;animation:spin 34s linear infinite}
.active{animation:pulse 5s ease-in-out infinite}
.trace{stroke-dasharray:32 29;animation:march 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{stroke-opacity:.52}}
@keyframes march{to{stroke-dashoffset:-610}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
<title id="title">Kothakota Rakesh technical toolkit</title>
<desc id="desc">Four premium cards for programming languages, interface engineering, APIs and backend, and AI with development tools. Subtle flowing animated highlights.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1424"/><stop offset="1" stop-color="#0e172b"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76f0dd" stop-opacity=".65"/><stop offset=".5" stop-color="#af9aff" stop-opacity=".33"/><stop offset="1" stop-color="#6ba8e9" stop-opacity=".55"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16263d"/><stop offset="1" stop-color="#132038"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70f2d2"/><stop offset="1" stop-color="#66c2e7"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1" fill="#8daacc" fill-opacity=".13"/></pattern>
  <radialGradient id="glow"><stop stop-color="#6fe5d5" stop-opacity=".19"/><stop offset="1" stop-color="#6fe5d5" stop-opacity="0"/></radialGradient>
</defs>
<style>
 .card{animation:float 8s ease-in-out infinite}
 .c2{animation-delay:-2s}.c3{animation-delay:-4s}.c4{animation-delay:-6s}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .p2{animation-delay:-1s}.p3{animation-delay:-2s}.p4{animation-delay:-3s}
 .travel{stroke-dasharray:18 18;animation:move 15s linear infinite}
 @keyframes float{50%{transform:translateY(-4px)}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes move{to{stroke-dashoffset:-648}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="555" rx="22" fill="url(#bg)"/>
<rect width="1200" height="555" rx="22" fill="url(#dots)"/>
<rect width="1198" height="553" x="1" y="1" rx="21" fill="none" stroke="#7899b9" stroke-opacity=".4" stroke-width="2"/>
<path d="M33 68H1167" stroke="url(#edge)" stroke-width="2" class="travel"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="34" y="43" fill="#a5f4e6" font-size="17" font-weight="900" letter-spacing="2.8">ENGINEERING TOOLKIT</text>
  <text x="1166" y="43" fill="#8098b4" font-size="14" text-anchor="end" letter-spacing="1.7">TECH / 01—04</text>
</g>
<g class="card">
  <rect x="32" y="88" width="555" height="207" rx="19" fill="url(#panel)" stroke="#427d8a" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="481" cy="153" rx="120" ry="115" fill="url(#glow)" class="pulse"/>
  <rect x="33" y="89" width="7" height="205" rx="3.5" fill="#6de7d3" opacity=".75"/>
  <rect x="58" y="114" width="66" height="66" rx="16" fill="#1e454e" stroke="#70d0c9" stroke-opacity=".65"/>
  <text x="91" y="158" text-anchor="middle" fill="#a2f9e7" font-family="monospace" font-size="31" font-weight="900">&lt;/&gt;</text>
  <text x="145" y="134" fill="#78ead9" font-family="Arial" font-size="15" font-weight="800" letter-spacing="2">01 / FOUNDATIONS</text>
  <text x="145" y="168" fill="#edf5ff" font-family="Arial" font-size="29" font-weight="900">Languages</text>
  <text x="60" y="227" fill="#c3d2e9" font-family="Arial" font-size="20" font-weight="600">Python  ·  JavaScript  ·  C</text>
  <text x="60" y="262" fill="#b1c4dd" font-family="Arial" font-size="19">HTML / CSS  ·  SQL</text>
  <g fill="#6de8dc"><rect x="494" y="234" width="56" height="4" rx="2" class="pulse"/><rect x="494" y="244" width="37" height="4" rx="2" opacity=".5"/></g>
</g>
<g class="card c2">
  <rect x="610" y="88" width="558" height="207" rx="19" fill="url(#panel)" stroke="#716caa" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="1060" cy="155" rx="120" ry="115" fill="url(#glow)" class="pulse p2"/>
  <rect x="611" y="89" width="7" height="205" rx="3.5" fill="#aa9cff" opacity=".82"/>
  <rect x="636" y="114" width="66" height="66" rx="16" fill="#333556" stroke="#ada1ef" stroke-opacity=".55"/>
  <rect x="649" y="130" width="40" height="32" rx="4" fill="none" stroke="#b9b2ff" stroke-width="3"/>
  <path d="M649 140H689M662 130V162" stroke="#b9b2ff" stroke-width="2"/>
  <text x="723" y="134" fill="#b2a9ff" font-family="Arial" font-size="15" font-weight="800" letter-spacing="2">02 / DESIGN SYSTEMS</text>
  <text x="723" y="168" fill="#edf5ff" font-family="Arial" font-size="29" font-weight="900">Frontend</text>
  <text x="638" y="227" fill="#c3d2e9" font-family="Arial" font-size="20" font-weight="600">React  ·  Next.js</text>
  <text x="638" y="262" fill="#b1c4dd" font-family="Arial" font-size="19">Responsive UI  ·  Motion</text>
  <g fill="#b0a0ff"><circle cx="1119" cy="241" r="5" class="pulse p2"/><circle cx="1139" cy="241" r="5" opacity=".5"/></g>
</g>
<g class="card c3">
  <rect x="32" y="315" width="555" height="207" rx="19" fill="url(#panel)" stroke="#5285a3" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="474" cy="378" rx="120" ry="115" fill="url(#glow)" class="pulse p3"/>
  <rect x="33" y="316" width="7" height="205" rx="3.5" fill="#74bdf2" opacity=".86"/>
  <rect x="58" y="341" width="66" height="66" rx="16" fill="#233a57" stroke="#75b8e3" stroke-opacity=".6"/>
  <circle cx="91" cy="374" r="14" fill="none" stroke="#8accf5" stroke-width="3"/>
  <path d="M71 374H111M91 354V394" stroke="#8accf5" stroke-width="2.2"/>
  <text x="145" y="361" fill="#85ccf3" font-family="Arial" font-size="15" font-weight="800" letter-spacing="2">03 / SERVER LOGIC</text>
  <text x="145" y="395" fill="#edf5ff" font-family="Arial" font-size="29" font-weight="900">Backend</text>
  <text x="60" y="454" fill="#c3d2e9" font-family="Arial" font-size="20" font-weight="600">FastAPI  ·  Flask  ·  REST</text>
  <text x="60" y="489" fill="#b1c4dd" font-family="Arial" font-size="19">Databases  ·  APIs</text>
  <g fill="#81c6ed"><rect x="509" y="464" width="11" height="11" rx="2" class="pulse p3"/><rect x="526" y="464" width="11" height="11" rx="2" opacity=".45"/></g>
</g>
<g class="card c4">
  <rect x="610" y="315" width="558" height="207" rx="19" fill="url(#panel)" stroke="#8673a5" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="1060" cy="377" rx="120" ry="115" fill="url(#glow)" class="pulse p4"/>
  <rect x="611" y="316" width="7" height="205" rx="3.5" fill="#e1abf3" opacity=".85"/>
  <rect x="636" y="341" width="66" height="66" rx="16" fill="#3d304e" stroke="#c597dd" stroke-opacity=".62"/>
  <g stroke="#e1b4f6" stroke-width="2.5" fill="none"><circle cx="669" cy="374" r="11"/><circle cx="654" cy="363" r="4"/><circle cx="684" cy="363" r="4"/><circle cx="669" cy="390" r="4"/><path d="M658 366L663 370M680 366L675 370M669 385V378"/></g>
  <text x="723" y="361" fill="#dcb2f0" font-family="Arial" font-size="15" font-weight="800" letter-spacing="2">04 / INTELLIGENCE</text>
  <text x="723" y="395" fill="#edf5ff" font-family="Arial" font-size="29" font-weight="900">AI &amp; Tools</text>
  <text x="638" y="454" fill="#c3d2e9" font-family="Arial" font-size="20" font-weight="600">Machine Learning  ·  Graphs</text>
  <text x="638" y="489" fill="#b1c4dd" font-family="Arial" font-size="19">Git  ·  Docker  ·  Testing</text>
  <g fill="#d2b0ec"><circle cx="1119" cy="467" r="4" class="pulse p4"/><circle cx="1139" cy="467" r="4" opacity=".55"/></g>
</g>
</svg>